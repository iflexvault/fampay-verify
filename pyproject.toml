[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fampay-verify"
version = "1.0.4"
description = "FamPay payment verification utility and QR generator for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "qrcode>=7.4",
    "imap-tools>=0.55",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["fampay", "upi", "payment", "verification", "qr-code", "imap", "gmail"]

[project.urls]
Homepage = "https://github.com/iflexvault/fampay-verify"
Repository = "https://github.com/iflexvault/fampay-verify"
Issues = "https://github.com/iflexvault/fampay-verify/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
supabase = [
    "supabase>=2.0",
]
pil = [
    "pillow>=9.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fampay_verify*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true